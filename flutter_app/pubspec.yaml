name: dodroidai
description: DoDroidAI Flutter client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_markdown: ^0.7.5
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sherpa_onnx: ^2.0.1
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  battery_plus: ^7.1.2
  android_intent_plus: ^6.1.0
  url_launcher: ^6.3.3
  record: ^5.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  workmanager: ^0.10.10
  flutter_local_notifications: ^17.2.2
  home_widget: ^0.10.0
  quick_actions: ^1.1.1
dependency_overrides:
  record_linux:
    path: third_party/record_linux_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
