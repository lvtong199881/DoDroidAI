<rect x="325" y="195.5" width="30" height="30" rx="15" fill="#FFFFFF"/>
<path d="M334.5 205L345.5 216M345.5 205L334.5 216" stroke="#171A1F" stroke-width="2" stroke-linecap="round" fill="none"/>
</g></g>
</svg>
