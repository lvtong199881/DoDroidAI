<text x="44" y="220.93" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="600" fill="#171A1F" text-anchor="start" >欢迎使用 DoDroidAI</text>
<text x="44" y="250.63" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="400" fill="#5B6270" text-anchor="start" >说一句话，让手机替你做事。</text>
<rect x="44" y="275.73" width="232" height="255.55" rx="0" fill="none" />
<rect x="44" y="275.73" width="232" height="80.8" rx="0" fill="none" />
