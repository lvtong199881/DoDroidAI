<rect x="20" y="151.75" width="320" height="496.5" rx="16" fill="#FFFFFF" />
<rect x="20" y="151.75" width="320" height="416.5" rx="0" fill="none" />
<text x="44" y="191.95" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="600" fill="#171A1F" text-anchor="start" >Welcome to DoDroidAI</text>
<text x="44" y="221.65" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="400" fill="#5B6270" text-anchor="start" >Say it, and let your phone do it.</text>
<rect x="44" y="246.75" width="272" height="313.5" rx="0" fill="none" />
<rect x="44" y="246.75" width="272" height="99.65" rx="0" fill="none" />
<g transform="translate(44 246.75) scale(0.92)" fill="none" stroke="#4D6BFE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#4D6BFE" ><path d="M12 3.2a2.8 2.8 0 0 0-2.8 2.8v6a2.8 2.8 0 0 0 5.6 0V6A2.8 2.8 0 0 0 12 3.2Z"/><path d="M5.5 11.2a6.5 6.5 0 0 0 13 0"/><path d="M12 17.7v3.1"/><path d="M8.6 20.8h6.8"/></g>
<rect x="78" y="246.75" width="238" height="99.65" rx="0" fill="none" />
<text x="78" y="262.27" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >Just hold to talk</text>
<text x="78" y="285.11" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >Speech recognition and read-aloud <tspan x="78" dy="18.85">run on your phone; voice models </tspan><tspan x="78" dy="18.85">download once over the network </tspan><tspan x="78" dy="18.85">(automatic on Wi-Fi).</tspan></text>
<rect x="44" y="362.4" width="272" height="80.8" rx="0" fill="none" />
<g transform="translate(44 362.4) scale(0.92)" fill="none" stroke="#4D6BFE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#4D6BFE" ><path d="M8.4 2.4h7.2a2.2 2.2 0 0 1 2.2 2.2v14.8a2.2 2.2 0 0 1-2.2 2.2H8.4a2.2 2.2 0 0 1-2.2-2.2V4.6a2.2 2.2 0 0 1 2.2-2.2Z"/><path d="M10.4 4.9h3.2"/><path d="M11 19.2h2"/></g>
<rect x="78" y="362.4" width="238" height="80.8" rx="0" fill="none" />
<text x="78" y="377.92" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >It acts, not just chats</text>
<text x="78" y="400.76" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >Sending texts and saving notes ask <tspan x="78" dy="18.85">for your confirmation first; alarms</tspan><tspan x="78" dy="18.85">and calendar events run directly.</tspan></text>
<rect x="44" y="459.2" width="272" height="101.05" rx="0" fill="none" />
<g transform="translate(44 459.2) scale(0.92)" fill="none" stroke="#4D6BFE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#4D6BFE" ><path d="M7.2 10.2h9.6a2 2 0 0 1 2 2v6.6a2 2 0 0 1-2 2H7.2a2 2 0 0 1-2-2v-6.6a2 2 0 0 1 2-2Z"/><path d="M8.4 10.2V7.4a3.6 3.6 0 0 1 7.2 0v2.8"/><circle cx="12" cy="15" r="1.05" fill="currentColor" stroke="none"/></g>
<rect x="78" y="459.2" width="238" height="101.05" rx="0" fill="none" />
<text x="78" y="474.73" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >Chats and notes stay on this <tspan x="78" dy="20.25">phone</tspan></text>
<text x="78" y="517.8" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >Stored locally; chats can be <tspan x="78" dy="18.85">exported anytime. AI requests go to </tspan><tspan x="78" dy="18.85">the provider you configure.</tspan></text>
<rect x="20" y="568.25" width="320" height="80" rx="0" fill="none" />
<rect x="40" y="580.25" width="280" height="48" rx="24" fill="#4D6BFE" />
<rect x="122.65" y="594.25" width="114.7" height="20" rx="0" fill="none" />
<g transform="translate(122.65 594.25) scale(0.83)" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#FFFFFF" ><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" fill="currentColor" stroke="none"/></g>
<text x="150.65" y="609.65" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start" >Get started</text>
