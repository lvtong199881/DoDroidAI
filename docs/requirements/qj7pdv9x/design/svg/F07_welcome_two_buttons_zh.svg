</g>
<!-- close_button: 32dp visual / 48dp hit, center pinned to dialog top-right, 50% exposed -->
<rect x="324" y="194.5" width="32" height="32" rx="16" fill="#C6CBD4" filter="url(#closeShadow)"/>
