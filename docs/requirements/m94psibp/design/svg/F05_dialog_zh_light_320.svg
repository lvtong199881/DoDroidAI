<text x="78" y="291.25" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >按住说话就行</text>
<text x="78" y="314.08" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >语音识别和朗读在手机本地完成；<tspan x="78" dy="18.85">首次使用需联网下载语音模型（默</tspan><tspan x="78" dy="18.85">认 Wi-Fi 下自动下载）。</tspan></text>
<rect x="44" y="372.53" width="232" height="61.95" rx="0" fill="none" />
<g transform="translate(44 372.53) scale(0.92)" fill="none" stroke="#4D6BFE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#4D6BFE" ><path d="M8.4 2.4h7.2a2.2 2.2 0 0 1 2.2 2.2v14.8a2.2 2.2 0 0 1-2.2 2.2H8.4a2.2 2.2 0 0 1-2.2-2.2V4.6a2.2 2.2 0 0 1 2.2-2.2Z"/><path d="M10.4 4.9h3.2"/><path d="M11 19.2h2"/></g>
<rect x="78" y="372.53" width="198" height="61.95" rx="0" fill="none" />
<text x="78" y="388.05" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >它会动手，不只是聊天</text>
<text x="78" y="410.88" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >发短信、记笔记前会先请你确认；<tspan x="78" dy="18.85">闹钟、日历等操作直接执行。</tspan></text>
<rect x="44" y="450.48" width="232" height="80.8" rx="0" fill="none" />
<g transform="translate(44 450.48) scale(0.92)" fill="none" stroke="#4D6BFE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#4D6BFE" ><path d="M7.2 10.2h9.6a2 2 0 0 1 2 2v6.6a2 2 0 0 1-2 2H7.2a2 2 0 0 1-2-2v-6.6a2 2 0 0 1 2-2Z"/><path d="M8.4 10.2V7.4a3.6 3.6 0 0 1 7.2 0v2.8"/><circle cx="12" cy="15" r="1.05" fill="currentColor" stroke="none"/></g>
<rect x="78" y="450.48" width="198" height="80.8" rx="0" fill="none" />
<text x="78" y="466" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#171A1F" text-anchor="start" >会话和笔记留在本机</text>
<text x="78" y="488.83" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start" >保存在本机，会话可随时导出；使<tspan x="78" dy="18.85">用 AI </tspan><tspan x="78" dy="18.85">时内容会发送给你配置的服务商。</tspan></text>
