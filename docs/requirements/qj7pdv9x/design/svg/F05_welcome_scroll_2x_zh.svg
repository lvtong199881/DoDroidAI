<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="400" viewBox="0 0 640 400">
<defs><filter id="dlgShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/></filter>
<filter id="closeShadow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="400" fill="#F7F8FA"/>
<rect width="640" height="400" fill="rgba(0,0,0,0.54)"/>
<rect x="20" y="40" width="600" height="320" rx="16" fill="#FFFFFF" filter="url(#dlgShadow)"/>
<clipPath id="dlgClip"><rect x="20" y="40" width="600" height="320" rx="16"/></clipPath>
<g clip-path="url(#dlgClip)">
<clipPath id="scrollClip"><rect x="20" y="40" width="600" height="240"/></clipPath>
<g clip-path="url(#scrollClip)">
<image href="../assets/welcome_hero_light.png" x="20" y="-170" width="600" height="300" preserveAspectRatio="xMidYMid slice"/>
<text x="320" y="190.4" font-family="'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="40" font-weight="600" fill="#171A1F" text-anchor="middle">欢迎使用 DoDroidAI</text>
<text x="320" y="241.8" font-family="'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="30" font-weight="400" fill="#5B6270" text-anchor="middle">说一句话，让手机替你做事。</text>
</g>
<rect x="40" y="292" width="560" height="48" rx="24" fill="#4D6BFE"/>
<text x="320" y="326.8" font-family="'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">开始使用</text>
</g>
<!-- close_button: 32dp visual / 48dp hit, center pinned to dialog top-right, 50% exposed -->
<rect x="604" y="24" width="32" height="32" rx="16" fill="#C6CBD4" filter="url(#closeShadow)"/>
<g><title>关闭</title>
<g transform="translate(620 40) scale(1) translate(-620 -40)">
<rect x="604" y="24" width="32" height="32" rx="16" fill="#C6CBD4"/>
<rect x="605" y="25" width="30" height="30" rx="15" fill="#FFFFFF"/>
<path d="M614.5 34.5L625.5 45.5M625.5 34.5L614.5 45.5" stroke="#171A1F" stroke-width="2" stroke-linecap="round" fill="none"/>
</g></g>
</svg>
